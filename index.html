<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>尾羽急ルーレット</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    min-height:100%;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    background:#050505;
    color:white;
    overflow-x:hidden;
}

body{
    min-height:100vh;
}

#background{
    position:fixed;
    inset:0;
    z-index:-10;
    background:
        radial-gradient(circle at 50% 20%,#292929 0%,#090909 45%,#000 100%);
}

#rainbowBg{
    position:fixed;
    inset:-50%;
    z-index:-9;
    opacity:.08;
    background:
        conic-gradient(
            red,
            orange,
            yellow,
            lime,
            cyan,
            blue,
            magenta,
            red
        );
    animation:rainbowRotate 10s linear infinite;
}

@keyframes rainbowRotate{
    from{transform:rotate(0deg)}
    to{transform:rotate(360deg)}
}

.container{
    width:100%;
    max-width:900px;
    margin:auto;
    padding:25px 15px 50px;
    text-align:center;
}

h1{
    margin:5px 0 5px;
    font-size:clamp(35px,8vw,75px);
    font-weight:1000;
    letter-spacing:4px;
    color:white;
    text-shadow:
        0 0 5px white,
        0 0 15px #00eaff,
        0 0 30px #008cff,
        0 0 60px #0066ff;
    animation:titlePulse 1.8s infinite alternate;
}

@keyframes titlePulse{
    from{
        transform:scale(1);
        filter:brightness(1);
    }
    to{
        transform:scale(1.025);
        filter:brightness(1.4);
    }
}

.subtitle{
    font-size:14px;
    opacity:.75;
    margin-bottom:10px;
}

#mode{
    display:inline-block;
    padding:7px 18px;
    border-radius:999px;
    margin-bottom:20px;
    font-weight:900;
    font-size:15px;
    background:#222;
    border:1px solid #555;
    box-shadow:0 0 15px #000;
}

.kakuhen{
    background:
        linear-gradient(
            90deg,
            red,
            orange,
            yellow,
            lime,
            cyan,
            blue,
            magenta,
            red
        );
    background-size:400% 100%;
    animation:kakuhenRainbow 1s linear infinite;
    color:white;
    border:2px solid white;
    box-shadow:
        0 0 10px white,
        0 0 30px cyan,
        0 0 50px magenta;
}

@keyframes kakuhenRainbow{
    from{background-position:0% 50%}
    to{background-position:400% 50%}
}

/* スロット */

.slot{
    position:relative;
    width:100%;
    height:120px;
    overflow:hidden;
    border-radius:20px;
    padding:5px;

    background:
        linear-gradient(
            90deg,
            red,
            orange,
            yellow,
            lime,
            cyan,
            blue,
            magenta,
            red
        );

    background-size:300% 100%;
    animation:borderRainbow 2s linear infinite;

    box-shadow:
        0 0 10px white,
        0 0 25px cyan,
        0 0 50px #0066ff,
        inset 0 0 20px black;
}

@keyframes borderRainbow{
    from{background-position:0% 50%}
    to{background-position:300% 50%}
}

.reel{
    width:100%;
    height:100%;
    overflow:hidden;
    border-radius:15px;
    background:#050505;
    position:relative;
}

.reelTrack{
    width:100%;
    will-change:transform;
}

.reelItem{
    width:100%;
    height:110px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;

    padding:10px;

    font-size:clamp(18px,4vw,34px);
    font-weight:1000;

    color:white;

    text-shadow:
        0 0 5px white,
        0 0 15px cyan,
        0 0 25px blue;
}

/* 中央を強調するための光だけ。線は入れない */

.slot::after{
    content:"";
    position:absolute;
    left:5%;
    right:5%;
    top:50%;
    height:55%;
    transform:translateY(-50%);
    border-radius:15px;
    pointer-events:none;

    box-shadow:
        inset 0 0 25px rgba(255,255,255,.16),
        inset 0 0 50px rgba(0,220,255,.10);

    background:rgba(255,255,255,.015);
}

/* 結果 */

#result{
    min-height:60px;
    margin-top:22px;
    font-size:clamp(22px,5vw,40px);
    font-weight:1000;
    word-break:break-word;

    text-shadow:
        0 0 5px white,
        0 0 15px cyan,
        0 0 30px blue;
}

#rarity{
    min-height:35px;
    margin-top:8px;
    font-size:22px;
    font-weight:1000;
}

/* レアリティ */

.n{
    color:#aaa;
    text-shadow:0 0 10px #aaa;
}

.r{
    color:#4da6ff;
    text-shadow:
        0 0 10px #4da6ff,
        0 0 25px #008cff;
}

.sr{
    color:#b66cff;
    text-shadow:
        0 0 10px #b66cff,
        0 0 25px #8b00ff,
        0 0 45px #ff00ff;
}

.ssr{
    color:#ffd700;
    text-shadow:
        0 0 10px #ffd700,
        0 0 25px orange,
        0 0 45px red;
}

.ur{
    color:#00ffff;
    text-shadow:
        0 0 10px cyan,
        0 0 25px blue,
        0 0 50px magenta;
}

.lr{
    color:white;
    background:
        linear-gradient(
            90deg,
            red,
            orange,
            yellow,
            lime,
            cyan,
            blue,
            magenta,
            red
        );
    background-size:400% 100%;
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;

    animation:rainbowText 1s linear infinite;

    filter:
        drop-shadow(0 0 8px white)
        drop-shadow(0 0 20px cyan)
        drop-shadow(0 0 35px magenta);
}

@keyframes rainbowText{
    from{background-position:0% 50%}
    to{background-position:400% 50%}
}

/* ボタン */

#spinButton{
    margin-top:25px;
    width:min(500px,90%);
    padding:18px 20px;

    border:none;
    border-radius:18px;

    font-size:28px;
    font-weight:1000;

    color:white;
    background:
        linear-gradient(
            90deg,
            #ff0066,
            #ff8800,
            #ffee00,
            #00ff88,
            #00ccff,
            #6600ff,
            #ff00cc
        );

    background-size:300% 100%;
    animation:buttonRainbow 2s linear infinite;

    box-shadow:
        0 0 15px white,
        0 0 35px cyan,
        0 0 60px magenta;

    cursor:pointer;
}

@keyframes buttonRainbow{
    from{background-position:0% 50%}
    to{background-position:300% 50%}
}

#spinButton:active{
    transform:scale(.94);
}

#spinButton:disabled{
    opacity:.45;
    filter:grayscale(.5);
}

/* オーバーレイ */

.overlay{
    position:fixed;
    inset:0;
    z-index:100;

    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;

    background:
        radial-gradient(
            circle,
            rgba(0,255,255,.22),
            rgba(0,0,0,.92) 65%
        );

    pointer-events:none;
}

.overlayText{
    font-size:clamp(42px,11vw,100px);
    font-weight:1000;
    text-align:center;

    color:white;

    text-shadow:
        0 0 10px white,
        0 0 30px cyan,
        0 0 60px blue,
        0 0 100px magenta;

    animation:overlayPulse .55s infinite alternate;
}

.overlaySub{
    margin-top:15px;
    font-size:clamp(20px,5vw,40px);
    font-weight:900;
}

@keyframes overlayPulse{
    from{
        transform:scale(1);
        opacity:.8;
    }
    to{
        transform:scale(1.08);
        opacity:1;
    }
}

/* フラッシュ */

#flash{
    position:fixed;
    inset:0;
    z-index:200;

    background:white;
    opacity:0;
    pointer-events:none;
}

/* エフェクト */

.shake{
    animation:shake .08s infinite;
}

@keyframes shake{
    0%{transform:translate(0,0)}
    25%{transform:translate(5px,-4px)}
    50%{transform:translate(-5px,4px)}
    75%{transform:translate(4px,5px)}
    100%{transform:translate(-4px,-5px)}
}

.pulse{
    animation:pulse .35s infinite alternate;
}

@keyframes pulse{
    from{transform:scale(1)}
    to{transform:scale(1.08)}
}

.particle{
    position:fixed;
    width:8px;
    height:8px;
    border-radius:50%;
    z-index:300;
    pointer-events:none;

    background:white;

    box-shadow:
        0 0 10px white,
        0 0 20px cyan;
}

/* スマホ */

@media(max-width:600px){
    .container{
        padding-top:18px;
    }

    h1{
        letter-spacing:2px;
    }

    .slot{
        height:120px;
    }

    .reelItem{
        height:110px;
        font-size:19px;
    }

    #spinButton{
        font-size:24px;
    }
}
</style>
</head>

<body>

<div id="background"></div>
<div id="rainbowBg"></div>
<div id="flash"></div>

<div class="container">

    <h1>尾羽急ルーレット</h1>

    <div class="subtitle">
        尾羽急の列車を引き当てろ！
    </div>

    <div id="mode">
        通常モード
    </div>

    <div class="slot">
        <div class="reel">
            <div id="reelTrack" class="reelTrack"></div>
        </div>
    </div>

    <div id="result">
        ルーレットを回してね！
    </div>

    <div id="rarity"></div>

    <button id="spinButton">
        🎰 回す！
    </button>

</div>

<div id="overlay" class="overlay">
    <div id="overlayText" class="overlayText"></div>
    <div id="overlaySub" class="overlaySub"></div>
</div>

<script>

/* =========================================
   尾羽急 列車リスト
========================================= */

const trains = [

"尾羽原発普通安越行き",
"尾羽原発普通雲谷行き",
"尾羽原発普通高徳行き",
"尾羽原発普通紀田行き",
"尾羽原発普通千鳥行き",
"尾羽原発普通金田行き",
"尾羽原発普通金田新都心行き",
"尾羽原発普通百鳥行き",
"尾羽原発普通北尾羽行き",
"尾羽原発普通奥千鳥行き",
"尾羽原発普通飛岡行き",
"尾羽原発普通飛水竜田行き",
"尾羽原発普通飛水柏原行き",

"尾羽原発快速高徳行き",
"尾羽原発快速紀田行き",
"尾羽原発快速千鳥行き",
"尾羽原発快速奥千鳥行き",

"尾羽原発急行紀田行き",
"尾羽原発急行千鳥行き",
"尾羽原発急行金田行き",
"尾羽原発急行金田新都心行き",

"尾羽原発準急高徳行き",
"尾羽原発準急紀田行き",
"尾羽原発準急金田行き",

"尾羽原発快速急行千鳥行き",
"尾羽原発快速急行金田行き",
"尾羽原発快速急行北尾羽行き",
"尾羽原発快速急行金田新都心行き",

"尾羽原発エアポート急行高徳空港行き",

"尾羽原発特急やまかぜ北尾羽行き",
"尾羽原発air特急金田新都心行き",
"尾羽原発特急つばき金田新都心行き",
"尾羽原発特急スーパーつばき金田新都心行き(全停車型)",
"尾羽原発特急スーパーつばき金田新都心行き(速達)",
"尾羽原発特急ほしみ金田新都心行き",

"井口発普通列車本郷行き",
"井口発普通列車千鳥行き(井問)",
"井口発普通列車千鳥行き(千鳥支)",

"北尾羽発普通百鳥行き",
"北尾羽発普通金田行き",
"北尾羽発普通金田新都心行き",
"北尾羽発特急はね金田新都心行き",

"千鳥発普通金田行き",
"千鳥発普通金田新都心行き",
"千鳥発普通北尾羽行き",
"千鳥発普通高徳行き",
"千鳥発普通尾羽原行き",

"千鳥発準急金田行き",
"千鳥発準急北尾羽行き",
"千鳥発準急高徳行き",
"千鳥発準急尾羽原行き",

"千鳥発急行高徳行き",
"千鳥発急行尾羽原行き",
"千鳥発急行金田行き",
"千鳥発急行金田新都心行き",
"千鳥発急行百鳥行き",
"千鳥発急行北尾羽行き",

"千鳥発快速急行金田行き",
"千鳥発快速急行金田新都心行き",
"千鳥発快速急行北尾羽行き",
"千鳥発快速急行高徳行き",
"千鳥発快速急行尾羽原行き",

"千鳥発普通本郷行き(井問)",
"千鳥発普通本郷行き(千鳥支)",
"千鳥発普通井口行き(井問)",
"千鳥発普通井口行き(千鳥支)"

];


/* =========================================
   状態
========================================= */

let spinning = false;
let kakuhen = false;


/* =========================================
   列車種別
   ※ 判定順が重要
========================================= */

function getType(train){

    if(train.includes("特急") || train.includes("air特急")){
        return "特急";
    }

    if(train.includes("快速急行")){
        return "快速急行";
    }

    if(train.includes("エアポート急行")){
        return "エアポート急行";
    }

    if(train.includes("急行")){
        return "急行";
    }

    if(train.includes("快速")){
        return "快速";
    }

    if(train.includes("準急")){
        return "準急";
    }

    return "普通";
}


/* =========================================
   レアリティ
========================================= */

function getRarity(type){

    switch(type){

        case "普通":
            return ["N","n"];

        case "準急":
            return ["R","r"];

        case "快速":
            return ["SR","sr"];

        case "急行":
            return ["SSR","ssr"];

        case "エアポート急行":
            return ["UR","ur"];

        case "快速急行":
            return ["UR","ur"];

        case "特急":
            return ["LR","lr"];
    }
}


/* =========================================
   ランク
========================================= */

function rank(type){

    const ranks = {
        "普通":1,
        "準急":2,
        "快速":3,
        "急行":4,
        "エアポート急行":5,
        "快速急行":6,
        "特急":7
    };

    return ranks[type] || 1;
}


/* =========================================
   完全ランダム抽選
   ★ 全列車が完全に同じ確率
========================================= */

function chooseTrain(){

    const index =
        Math.floor(Math.random() * trains.length);

    return trains[index];
}


/* =========================================
   昇格対象
   ★ 中央に止まった結果に対してだけ実行
========================================= */

function canUpgrade(type){

    return (
        type === "急行" ||
        type === "エアポート急行" ||
        type === "快速急行"
    );
}


/* =========================================
   昇格確率

   ★ 普通・準急・快速・特急には
     昇格処理を一切しない

   ★ 当選した列車そのものを
     変更するわけではない
========================================= */

function upgradeChance(type){

    if(!canUpgrade(type)){
        return 0;
    }

    if(type === "急行"){
        return kakuhen ? 0.45 : 0.30;
    }

    if(type === "エアポート急行"){
        return kakuhen ? 0.60 : 0.45;
    }

    if(type === "快速急行"){
        return kakuhen ? 0.75 : 0.60;
    }

    return 0;
}


/* =========================================
   昇格先

   ★ 中央に止まった列車を基準にする
========================================= */

function getUpgradeType(type){

    if(type === "急行"){
        return "快速急行";
    }

    if(type === "エアポート急行"){
        return "特急";
    }

    if(type === "快速急行"){
        return "特急";
    }

    return type;
}


/* =========================================
   昇格演出用の列車選択

   ★ これは「当選結果」を変更するためではなく、
     昇格演出が発生した場合の演出表示用
========================================= */

function randomTrainOfType(type){

    const candidates =
        trains.filter(t => getType(t) === type);

    if(candidates.length === 0){
        return null;
    }

    return candidates[
        Math.floor(Math.random() * candidates.length)
    ];
}


/* =========================================
   リール作成

   ★ finalTrain が中央に止まる
========================================= */

function createReelItems(finalTrain){

    const items = [];

    for(let i=0;i<50;i++){

        items.push(
            trains[
                Math.floor(Math.random() * trains.length)
            ]
        );

    }

    items.push(finalTrain);

    return items;
}


/* =========================================
   待機
========================================= */

function wait(ms){

    return new Promise(resolve =>
        setTimeout(resolve,ms)
    );
}


/* =========================================
   フラッシュ
========================================= */

async function flash(count=3, speed=100){

    const el =
        document.getElementById("flash");

    for(let i=0;i<count;i++){

        el.style.opacity="0.95";

        await wait(speed);

        el.style.opacity="0";

        await wait(speed);
    }
}


/* =========================================
   パーティクル
========================================= */

function particles(count=80){

    for(let i=0;i<count;i++){

        const p =
            document.createElement("div");

        p.className="particle";

        p.style.left =
            Math.random()*100+"vw";

        p.style.top =
            Math.random()*100+"vh";

        const size =
            3 + Math.random()*10;

        p.style.width=size+"px";
        p.style.height=size+"px";

        document.body.appendChild(p);

        const x =
            (Math.random()-.5)*700;

        const y =
            (Math.random()-.5)*700;

        const duration =
            700 + Math.random()*1300;

        p.animate(
            [
                {
                    transform:"translate(0,0) scale(1)",
                    opacity:1
                },
                {
                    transform:
                        `translate(${x}px,${y}px) scale(0)`,
                    opacity:0
                }
            ],
            {
                duration:duration,
                easing:"cubic-bezier(.1,.8,.2,1)"
            }
        );

        setTimeout(
            ()=>p.remove(),
            duration
        );
    }
}


/* =========================================
   オーバーレイ
========================================= */

async function showOverlay(text,sub=""){

    const overlay =
        document.getElementById("overlay");

    document.getElementById("overlayText")
        .textContent=text;

    document.getElementById("overlaySub")
        .textContent=sub;

    overlay.style.display="flex";
}


function hideOverlay(){

    document.getElementById("overlay")
        .style.display="none";
}


/* =========================================
   虹モード
========================================= */

function rainbowMode(on=true){

    const bg =
        document.getElementById("rainbowBg");

    bg.style.opacity =
        on ? ".30" : ".08";
}


/* =========================================
   昇格演出
========================================= */

async function upgradeEffect(originalType){

    const upgradedType =
        getUpgradeType(originalType);

    const upgradedTrain =
        randomTrainOfType(upgradedType);

    await showOverlay(
        "🔥 昇格!! 🔥",
        originalType + " → " + upgradedType
    );

    document.body.classList.add("shake");

    rainbowMode(true);

    await flash(5,90);

    particles(130);

    await wait(1200);

    document.body.classList.remove("shake");

    hideOverlay();

    return upgradedTrain;
}


/* =========================================
   急行以上の激アツ演出
========================================= */

async function rareEffect(type){

    if(type === "特急"){

        await showOverlay(
            "👑 超激アツ!! 👑",
            "特急を引き当てた!!"
        );

        rainbowMode(true);

        document.body.classList.add("shake");
        document.body.classList.add("pulse");

        await flash(8,70);

        particles(180);

        await wait(1500);

        document.body.classList.remove("shake");
        document.body.classList.remove("pulse");

        hideOverlay();

        rainbowMode(false);

        return;
    }


    if(type === "快速急行"){

        await showOverlay(
            "🔥 激アツ!! 🔥",
            "快速急行を引き当てた!!"
        );

        document.body.classList.add("shake");

        await flash(5,90);

        particles(110);

        await wait(1200);

        document.body.classList.remove("shake");

        hideOverlay();

        return;
    }


    if(type === "エアポート急行"){

        await showOverlay(
            "✈️ 激アツ!! ✈️",
            "エアポート急行を引き当てた!!"
        );

        await flash(4,100);

        particles(90);

        await wait(1000);

        hideOverlay();

        return;
    }


    if(type === "急行"){

        await showOverlay(
            "🔥 激アツ!! 🔥",
            "急行を引き当てた!!"
        );

        await flash(3,110);

        particles(70);

        await wait(900);

        hideOverlay();

        return;
    }
}


/* =========================================
   確変突入
========================================= */

async function enterKakuhen(type){

    let chance = 0;

    if(type === "急行"){
        chance = 0.30;
    }

    if(type === "エアポート急行"){
        chance = 0.45;
    }

    if(type === "快速急行"){
        chance = 0.65;
    }

    if(type === "特急"){
        chance = 0.85;
    }

    if(Math.random() > chance){
        return;
    }

    kakuhen=true;

    await showOverlay(
        "🔥 確変突入!! 🔥",
        "ここからが本番だ!!"
    );

    rainbowMode(true);

    document.body.classList.add("shake");

    await flash(10,70);

    particles(200);

    await wait(1700);

    document.body.classList.remove("shake");

    hideOverlay();

    document.getElementById("mode")
        .textContent="🔥 確変中 🔥";

    document.getElementById("mode")
        .className="kakuhen";
}


/* =========================================
   確変終了判定
========================================= */

async function checkKakuhenEnd(){

    if(!kakuhen){
        return;
    }

    // 22%で終了
    if(Math.random() < 0.22){

        await showOverlay(
            "確変終了",
            "通常モードへ戻ります"
        );

        await wait(1200);

        hideOverlay();

        kakuhen=false;

        rainbowMode(false);

        const mode =
            document.getElementById("mode");

        mode.textContent="通常モード";
        mode.className="";
    }
}


/* =========================================
   編成が必要か
========================================= */

function needsCarChoice(train){

    // 井口発は編成表示なし
    if(train.includes("井口発")){
        return false;
    }

    // 千鳥→本郷/井口の特殊系
    if(
        train.includes("千鳥発普通本郷行き(井問)") ||
        train.includes("千鳥発普通本郷行き(千鳥支)") ||
        train.includes("千鳥発普通井口行き(井問)") ||
        train.includes("千鳥発普通井口行き(千鳥支)")
    ){
        return false;
    }

    // 飛水系
    if(
        train.includes("尾羽原発普通飛水竜田行き") ||
        train.includes("尾羽原発普通飛水柏原行き")
    ){
        return false;
    }

    return true;
}


/* =========================================
   2両 / 3両以上
========================================= */

function randomCars(){

    return Math.random() < 0.5
        ? "2両"
        : "3両以上";
}


/* =========================================
   編成決定演出
========================================= */

async function carEffect(train){

    if(!needsCarChoice(train)){
        return train;
    }

    const cars =
        randomCars();

    await showOverlay(
        "🚃 編成決定!!",
        "……" + cars + "……"
    );

    if(cars === "3両以上"){

        rainbowMode(true);

        document.body.classList.add("shake");

        await flash(7,70);

        particles(150);

        await wait(1400);

        document.body.classList.remove("shake");

        rainbowMode(false);

    }else{

        await flash(3,110);

        particles(50);

        await wait(1100);
    }

    hideOverlay();

    return train + "【" + cars + "】";
}


/* =========================================
   結果表示
========================================= */

function showResult(train){

    const result =
        document.getElementById("result");

    const rarity =
        document.getElementById("rarity");

    const type =
        getType(train);

    const [rarityText,rarityClass] =
        getRarity(type);

    result.textContent=train;

    rarity.textContent =
        rarityText + " / " + type;

    rarity.className=rarityClass;
}


/* =========================================
   メイン
========================================= */

async function spin(){

    if(spinning){
        return;
    }

    spinning=true;

    const button =
        document.getElementById("spinButton");

    button.disabled=true;

    document.getElementById("result")
        .textContent="";

    document.getElementById("rarity")
        .textContent="";


    /*
       ★★★★★★★★★★★★★★★★★★★★★★
       ここが今回の超重要ポイント
       
       まず「中央に止める列車」を
       全列車から完全ランダムで決める。

       この時点で当選結果は確定。
       ★★★★★★★★★★★★★★★★★★★★★★
    */

    const finalTrain =
        chooseTrain();

    const originalType =
        getType(finalTrain);


    /* リール作成 */

    const track =
        document.getElementById("reelTrack");

    track.innerHTML="";


    const items =
        createReelItems(finalTrain);


    items.forEach((train,index)=>{

        const item =
            document.createElement("div");

        item.className="reelItem";

        item.textContent=train;

        item.dataset.index=index;

        track.appendChild(item);
    });


    /*
       初期位置
    */

    track.style.transition="none";

    track.style.transform=
        "translateY(0px)";


    await wait(100);


    /*
       中央に最後の列車を止める
    */

    const targetIndex =
        items.length - 1;

    const item =
        track.children[targetIndex];

    const slot =
        document.querySelector(".slot");

    const itemHeight =
        item.offsetHeight;

    const slotHeight =
        slot.clientHeight;

    const targetCenter =
        slotHeight / 2;

    const itemCenter =
        itemHeight / 2;

    const distance =
        targetIndex * itemHeight
        - (targetCenter - itemCenter);


    /*
       ★ スムーズなスロット移動
    */

    track.style.transition =
        "transform 7.5s cubic-bezier(.08,.72,.10,1)";

    track.style.transform =
        `translateY(-${distance}px)`;


    await wait(7600);


    /*
       ★★★★★★★★★★★★★★★★★★★★★★
       ここで中央に止まった finalTrain が
       「本当の当選結果」
       ★★★★★★★★★★★★★★★★★★★★★★
    */

    showResult(finalTrain);


    /*
       中央結果の種別
    */

    const centerType =
        getType(finalTrain);


    /*
       =====================================
       昇格判定
       
       ★ 特急には昇格演出をしない
       ★ 普通・準急・快速にも昇格演出をしない
       ★ 急行系だけ
       =====================================
    */

    if(canUpgrade(centerType)){

        const chance =
            upgradeChance(centerType);

        if(Math.random() < chance){

            /*
               昇格演出だけを行う。

               元のリール結果そのものは
               finalTrain のまま。
            */

            const upgradedTrain =
                await upgradeEffect(centerType);

            /*
               昇格演出が発生した場合だけ、
               最終表示を昇格先に変更する。

               つまり、

               急行
                  ↓
               快速急行

               快速急行
                  ↓
               特急

               のような「当選後の昇格」。
               
               特急が最初から中央なら
               この処理には絶対入らない。
            */

            if(upgradedTrain){

                showResult(upgradedTrain);
            }
        }
    }


    /*
       現在表示されている最終タイプ
    */

    let displayedTrain =
        document.getElementById("result")
            .textContent;

    let displayedType =
        getType(displayedTrain);


    /*
       レア演出
    */

    if(rank(displayedType) >= 4){

        await rareEffect(displayedType);
    }


    /*
       確変突入
    */

    if(
        !kakuhen &&
        rank(displayedType) >= 4
    ){

        await enterKakuhen(displayedType);
    }


    /*
       確変終了判定
    */

    await checkKakuhenEnd();


    /*
       編成決定
       
       ★ 表示中の列車に対して決定
    */

    const carResult =
        await carEffect(displayedTrain);


    if(carResult !== displayedTrain){

        showResult(carResult);
    }


    /*
       終了
    */

    spinning=false;

    button.disabled=false;
}


/* =========================================
   ボタン
========================================= */

document
    .getElementById("spinButton")
    .addEventListener("click",spin);


/* =========================================
   初期表示
========================================= */

document.getElementById("mode")
    .textContent="通常モード";

</script>

</body>
</html>
