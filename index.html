<!DOCTYPE html>qx
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>尾羽急ルーレット</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    min-height: 100vh;
    background:
        radial-gradient(circle at center, #202020 0%, #050505 70%);
    color: white;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    display: flex;
    justify-content: center;
    align-items: center;
    overflow-x: hidden;
}

.container {
    width: min(900px, 94%);
    text-align: center;
}

/* タイトル */

.logo {
    font-size: clamp(32px, 7vw, 64px);
    font-weight: 900;
    letter-spacing: 0.08em;

    margin-bottom: 25px;

    text-shadow:
        0 0 10px rgba(255,255,255,.5),
        0 0 30px rgba(0,150,255,.5);
}

.subtitle {
    color: #aaa;
    margin-bottom: 25px;
}

/* ルーレット表示 */

.roulette-box {
    position: relative;

    width: 100%;
    min-height: 250px;

    border-radius: 25px;

    background:
        linear-gradient(
            135deg,
            #111,
            #222
        );

    border: 2px solid #444;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 30px;

    box-shadow:
        0 0 40px rgba(0,0,0,.8),
        inset 0 0 40px rgba(255,255,255,.03);

    overflow: hidden;
}

.roulette-box::before {
    content: "";

    position: absolute;

    width: 500px;
    height: 500px;

    background:
        radial-gradient(
            circle,
            rgba(0,150,255,.15),
            transparent 65%
        );

    animation: rotateGlow 8s linear infinite;
}

@keyframes rotateGlow {
    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }
}

.result {
    position: relative;
    z-index: 2;

    font-size: clamp(22px, 5vw, 42px);

    font-weight: 900;

    line-height: 1.5;

    min-height: 130px;

    display: flex;
    flex-direction: column;
    justify-content: center;
}

.result .train {
    font-size: clamp(18px, 4vw, 30px);
    color: #aaa;
}

.result .route {
    font-size: clamp(25px, 6vw, 48px);
}

/* ボタン */

button {
    margin-top: 30px;

    border: none;

    padding:
        18px
        55px;

    border-radius: 999px;

    font-size: 24px;
    font-weight: 900;

    color: white;

    background:
        linear-gradient(
            135deg,
            #0077ff,
            #00b7ff
        );

    box-shadow:
        0 8px 30px rgba(0,140,255,.35);

    cursor: pointer;

    transition:
        transform .15s,
        box-shadow .15s;
}

button:active {
    transform: scale(.94);
}

button:disabled {
    opacity: .5;
}

/* レア表示 */

.rarity {
    margin-top: 20px;

    font-size: 24px;

    font-weight: 900;

    min-height: 35px;
}

.normal {
    color: #ddd;
}

.rare {
    color: #5fa8ff;
}

.ssr {
    color: #c879ff;
    text-shadow: 0 0 15px #9b35ff;
}

.ur {
    color: #ffae3b;
    text-shadow:
        0 0 10px #ff8c00,
        0 0 30px #ff4500;
}

.lr {
    color: #ff5555;
    text-shadow:
        0 0 10px red,
        0 0 30px red,
        0 0 60px orange;
}

/* 共通演出 */

.flash {
    animation: flash .25s infinite alternate;
}

@keyframes flash {
    from {
        filter: brightness(1);
    }

    to {
        filter: brightness(2.5);
    }
}

.shake {
    animation: shake .08s infinite;
}

@keyframes shake {
    0%   { transform: translate(2px, 1px); }
    25%  { transform: translate(-2px, -1px); }
    50%  { transform: translate(1px, -2px); }
    75%  { transform: translate(-1px, 2px); }
    100% { transform: translate(2px, 1px); }
}

/* プレミア */

.premium {
    position: fixed;

    inset: 0;

    display: none;

    justify-content: center;
    align-items: center;

    z-index: 999;

    background:
        radial-gradient(
            circle,
            rgba(255,255,255,.35),
            rgba(255,0,0,.15),
            rgba(0,0,0,.95)
        );

    pointer-events: none;
}

.premium.show {
    display: flex;
    animation: premiumIn .7s ease;
}

.premium-text {
    font-size: clamp(45px, 13vw, 130px);

    font-weight: 1000;

    text-align: center;

    color: white;

    text-shadow:
        0 0 10px red,
        0 0 30px red,
        0 0 70px orange;

    animation:
        premiumText .6s ease infinite alternate;
}

@keyframes premiumIn {
    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }
}

@keyframes premiumText {
    from {
        transform: scale(.85);
    }

    to {
        transform: scale(1.05);
    }
}

/* 注意書き */

.info {
    margin-top: 25px;

    color: #777;

    font-size: 13px;
}
</style>
</head>


<body>

<div class="container">

    <div class="logo">
        尾羽急ルーレット
    </div>

    <div class="subtitle">
        今日の列車運行を決めろ！
    </div>


    <div class="roulette-box" id="rouletteBox">

        <div class="result" id="result">

            <div class="train">
                🎰 準備完了
            </div>

            <div class="route">
                ルーレットを回そう！
            </div>

        </div>

    </div>


    <div class="rarity" id="rarity"></div>


    <button id="spinButton">
        🎰 回す！
    </button>


    <div class="info">
        ※ゲーム用のルーレットです
    </div>

</div>


<div class="premium" id="premium">

    <div class="premium-text" id="premiumText">
        PREMIUM
    </div>

</div>


<script>

/* =========================================
   尾羽急ルーレット データ
========================================= */

const trains = [

"尾羽原発普通安越行き",
"尾羽原発普通雲谷行き",
"尾羽原発普通高徳行き",
"尾羽原発普通紀田行き",
"尾羽原発普通千鳥行き",
"尾羽原発普通金田行き",
"尾羽原発普通金田新都心行き",
"尾羽原発普通百鳥行き",
"尾羽原発普通北尾羽行き",
"尾羽原発普通奥千鳥行き",
"尾羽原発普通飛岡行き",
"尾羽原発普通飛水竜田行き",
"尾羽原発普通飛水柏原行き",

"尾羽原発快速高徳行き",
"尾羽原発快速紀田行き",
"尾羽原発快速千鳥行き",
"尾羽原発快速奥千鳥行き",

"尾羽原発急行紀田行き",
"尾羽原発急行千鳥行き",
"尾羽原発急行金田行き",
"尾羽原発急行金田新都心行き",

"尾羽原発準急高徳行き",
"尾羽原発準急紀田行き",
"尾羽原発準急金田行き",

"尾羽原発快速急行千鳥行き",
"尾羽原発快速急行金田行き",
"尾羽原発快速急行北尾羽行き",
"尾羽原発快速急行金田新都心行き",

"尾羽原発エアポート急行高徳空港行き",

"尾羽原発特急やまかぜ北尾羽行き",

"尾羽原発air特急金田新都心行き",

"尾羽原発特急つばき金田新都心行き",

"尾羽原発特急スーパーつばき金田新都心行き(全停車型)",

"尾羽原発特急スーパーつばき金田新都心行き(速達)",

"尾羽原発特急ほしみ金田新都心行き",


"井口発普通列車本郷行き",

"井口発普通列車千鳥行き(井問)",

"井口発普通列車千鳥行き(千鳥支)",


"北尾羽発普通百鳥行き",
"北尾羽発普通金田行き",
"北尾羽発普通金田新都心行き",

"北尾羽発特急はね金田新都心行き",


"千鳥発普通金田行き",
"千鳥発普通金田新都心行き",
"千鳥発普通北尾羽行き",
"千鳥発普通高徳行き",
"千鳥発普通尾羽原行き",

"千鳥発準急金田行き",
"千鳥発準急北尾羽行き",
"千鳥発準急高徳行き",
"千鳥発準急尾羽原行き",

"千鳥発急行高徳行き",
"千鳥発急行尾羽原行き",
"千鳥発急行金田行き",
"千鳥発急行金田新都心行き",
"千鳥発急行百鳥行き",
"千鳥発急行北尾羽行き",

"千鳥発快速急行金田行き",
"千鳥発快速急行金田新都心行き",
"千鳥発快速急行北尾羽行き",
"千鳥発快速急行高徳行き",
"千鳥発快速急行尾羽原行き",

"千鳥発普通本郷行き(井問)",
"千鳥発普通本郷行き(千鳥支)",

"千鳥発普通井口行き(井問)",
"千鳥発普通井口行き(千鳥支)"

];


/* =========================================
   DOM
========================================= */

const result =
    document.getElementById("result");

const rarity =
    document.getElementById("rarity");

const button =
    document.getElementById("spinButton");

const box =
    document.getElementById("rouletteBox");

const premium =
    document.getElementById("premium");

const premiumText =
    document.getElementById("premiumText");


/* =========================================
   種別判定
========================================= */

function getType(train) {

    if (train.includes("スーパーつばき"))
        return "特急";

    if (train.includes("air特急"))
        return "特急";

    if (train.includes("特急"))
        return "特急";

    if (train.includes("快速急行"))
        return "快速急行";

    if (train.includes("エアポート急行"))
        return "急行";

    if (train.includes("急行"))
        return "急行";

    if (train.includes("快速"))
        return "快速";

    if (train.includes("準急"))
        return "準急";

    return "普通";
}


/* =========================================
   レア度
========================================= */

function getRarity(type) {

    switch(type) {

        case "特急":
            return {
                name: "🌈 LR — 超激レア",
                className: "lr"
            };

        case "快速急行":
            return {
                name: "🔥 UR — 激レア",
                className: "ur"
            };

        case "急行":
            return {
                name: "💜 SSR — レア",
                className: "ssr"
            };

        case "快速":
            return {
                name: "🔵 SR — ややレア",
                className: "rare"
            };

        case "準急":
            return {
                name: "🟢 R — レア",
                className: "rare"
            };

        default:
            return {
                name: "⚪ N — ノーマル",
                className: "normal"
            };
    }
}


/* =========================================
   結果表示
========================================= */

function showResult(train) {

    const type =
        getType(train);

    const rare =
        getRarity(type);

    result.innerHTML = `
        <div class="train">
            🚃 ${type}
        </div>

        <div class="route">
            ${train}
        </div>
    `;

    rarity.textContent =
        rare.name;

    rarity.className =
        "rarity " + rare.className;
}


/* =========================================
   演出
========================================= */

function playEffect(type) {

    box.classList.remove(
        "flash",
        "shake"
    );

    premium.classList.remove("show");


    if(type === "急行") {

        box.classList.add("flash");

        setTimeout(() => {
            box.classList.remove("flash");
        }, 1000);

    }


    if(type === "快速急行") {

        box.classList.add("shake");

        setTimeout(() => {

            box.classList.remove("shake");

        }, 1400);

    }


    if(type === "特急") {

        box.classList.add("shake");

        setTimeout(() => {

            box.classList.remove("shake");

            premiumText.textContent =
                "🌈 PREMIUM 🌈";

            premium.classList.add("show");


            setTimeout(() => {

                premium.classList.remove("show");

            }, 1800);

        }, 900);

    }

}


/* =========================================
   ルーレット
========================================= */

let spinning = false;

button.addEventListener(
    "click",
    () => {

        if(spinning)
            return;

        spinning = true;

        button.disabled = true;

        rarity.textContent = "";

        let count = 0;

        const total =
            35 + Math.floor(
                Math.random() * 20
            );

        let speed = 55;


        function roll() {

            const temp =
                trains[
                    Math.floor(
                        Math.random()
                        * trains.length
                    )
                ];

            result.innerHTML = `
                <div class="train">
                    🚃 抽選中
                </div>

                <div class="route">
                    ${temp}
                </div>
            `;


            count++;


            if(count >= total) {

                finish();

                return;

            }


            if(
                count >
                total * .65
            ) {

                speed += 15;

            }


            setTimeout(
                roll,
                speed
            );

        }


        function finish() {

            const selected =
                trains[
                    Math.floor(
                        Math.random()
                        * trains.length
                    )
                ];


            const type =
                getType(selected);


            showResult(selected);


            setTimeout(
                () => {

                    playEffect(type);

                    spinning = false;

                    button.disabled =
                        false;

                },
                150
            );

        }


        roll();

    }
);

</script>

</body>
</html>
