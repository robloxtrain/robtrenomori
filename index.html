<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>ロブとれの森</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:-apple-system,BlinkMacSystemFont,
    "SF Pro Display","Helvetica Neue",Arial,sans-serif;
    background:
        radial-gradient(circle at 20% 10%,#dcecff 0%,transparent 35%),
        radial-gradient(circle at 80% 20%,#f3e8ff 0%,transparent 35%),
        linear-gradient(135deg,#eef4ff,#f8f8fc);
    min-height:100vh;
    color:#111;
    padding-bottom:90px;
}

button,
input,
textarea{
    font:inherit;
}

button{
    border:0;
    cursor:pointer;
}

.glass{
    background:rgba(255,255,255,.62);
    backdrop-filter:blur(25px);
    -webkit-backdrop-filter:blur(25px);
    border:1px solid rgba(255,255,255,.75);
    box-shadow:
        0 10px 35px rgba(0,0,0,.08),
        inset 0 1px 0 rgba(255,255,255,.8);
}

/* HEADER */

header{
    position:sticky;
    top:0;
    z-index:100;
    padding:14px 18px;
}

.header-inner{
    max-width:900px;
    margin:auto;
    border-radius:24px;
    padding:12px 16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    display:flex;
    align-items:center;
    gap:9px;
    font-weight:800;
    font-size:20px;
}

.logo span{
    font-size:24px;
}

.header-user{
    display:flex;
    align-items:center;
    gap:8px;
}

.user-name{
    font-size:14px;
    font-weight:700;
}

.small-btn{
    padding:8px 13px;
    border-radius:14px;
    background:rgba(0,0,0,.06);
}

/* MAIN */

main{
    width:min(900px,calc(100% - 24px));
    margin:18px auto;
}

.page{
    display:none;
}

.page.active{
    display:block;
}

/* HERO */

.hero{
    border-radius:30px;
    padding:30px 24px;
    margin-bottom:18px;
}

.hero h1{
    font-size:38px;
    letter-spacing:-1.5px;
    margin-bottom:8px;
}

.hero p{
    color:#666;
    line-height:1.6;
}

.hero-buttons{
    display:flex;
    gap:10px;
    margin-top:20px;
    flex-wrap:wrap;
}

.primary{
    background:#111;
    color:white;
    padding:12px 18px;
    border-radius:16px;
    font-weight:700;
}

.secondary{
    background:rgba(255,255,255,.75);
    padding:12px 18px;
    border-radius:16px;
    font-weight:700;
}

/* CARDS */

.card{
    border-radius:24px;
    padding:20px;
    margin-bottom:14px;
}

.card-title{
    font-size:18px;
    font-weight:800;
    margin-bottom:10px;
}

.update{
    background:
        linear-gradient(135deg,
        rgba(255,255,255,.75),
        rgba(220,235,255,.6));
}

.update-tag{
    display:inline-block;
    background:#111;
    color:#fff;
    padding:5px 9px;
    border-radius:9px;
    font-size:11px;
    margin-bottom:10px;
}

/* POSTS */

.post{
    border-radius:23px;
    padding:18px;
    margin-bottom:13px;
}

.post-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:10px;
}

.post-user{
    font-weight:800;
}

.post-date{
    color:#888;
    font-size:12px;
}

.post-content{
    line-height:1.65;
    white-space:pre-wrap;
    word-break:break-word;
}

.post-actions{
    display:flex;
    gap:8px;
    margin-top:14px;
}

.action-btn{
    background:rgba(0,0,0,.05);
    padding:8px 13px;
    border-radius:13px;
}

.action-btn.liked{
    background:#111;
    color:#fff;
}

/* NAV */

.bottom-nav{
    position:fixed;
    bottom:14px;
    left:50%;
    transform:translateX(-50%);
    width:min(500px,calc(100% - 28px));
    z-index:200;
    border-radius:25px;
    padding:8px;
    display:flex;
    justify-content:space-around;
}

.nav-btn{
    background:transparent;
    padding:10px 14px;
    border-radius:17px;
    color:#666;
    font-weight:700;
}

.nav-btn.active{
    background:#111;
    color:#fff;
}

/* MODAL */

.modal-bg{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.35);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:500;
    padding:20px;
}

.modal-bg.show{
    display:flex;
}

.modal{
    width:min(430px,100%);
    border-radius:28px;
    padding:24px;
}

.modal h2{
    margin-bottom:18px;
}

.input{
    width:100%;
    padding:13px 15px;
    border-radius:15px;
    border:1px solid rgba(0,0,0,.08);
    background:rgba(255,255,255,.8);
    outline:none;
    margin-bottom:10px;
}

textarea.input{
    min-height:130px;
    resize:vertical;
}

.modal-buttons{
    display:flex;
    gap:8px;
    margin-top:8px;
}

.modal-buttons button{
    flex:1;
}

.close-btn{
    background:rgba(0,0,0,.06);
    padding:12px;
    border-radius:15px;
}

.switch{
    text-align:center;
    margin-top:15px;
    color:#555;
    font-size:14px;
}

.switch button{
    background:none;
    color:#007aff;
    font-weight:700;
}

/* PROFILE */

.profile{
    text-align:center;
    padding:28px;
}

.avatar{
    width:80px;
    height:80px;
    border-radius:50%;
    background:#111;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:30px;
    margin:0 auto 15px;
}

.profile-name{
    font-size:24px;
    font-weight:800;
}

.profile-info{
    color:#777;
    margin-top:5px;
}

/* EMPTY */

.empty{
    text-align:center;
    padding:35px;
    color:#777;
}

/* LOADING */

.loading{
    text-align:center;
    padding:30px;
    color:#777;
}

/* MOBILE */

@media(max-width:600px){

    .hero h1{
        font-size:31px;
    }

    .header-inner{
        border-radius:20px;
    }

    .user-name{
        display:none;
    }

    .card,
    .post{
        border-radius:20px;
    }
}
</style>
</head>

<body>

<header>
    <div class="header-inner glass">

        <div class="logo">
            <span>🚃</span>
            <div>
                ROB鉄
                <div style="
                    font-size:10px;
                    font-weight:500;
                    color:#777;">
                    Roblox鉄道SNS
                </div>
            </div>
        </div>

        <div class="header-user">
            <div id="headerUser" class="user-name">
                未ログイン
            </div>

            <button
                id="headerButton"
                class="small-btn"
                onclick="openLogin()">
                ログイン
            </button>
        </div>

    </div>
</header>


<main>

<!-- HOME -->

<section id="homePage" class="page active">

    <div class="hero glass">

        <h1>ロブ鉄SNS</h1>

        <p>
            Robloxの鉄道をもっと楽しもう。<br>
            最新情報を見たり、鉄道について投稿したりできます。
        </p>

        <div class="hero-buttons">

            <button
                class="primary"
                onclick="openPostModal()">
                ＋ 投稿する
            </button>

            <button
                class="secondary"
                onclick="showPage('updates')">
                尾羽急 最新情報
            </button>

        </div>

    </div>


    <div class="card glass update">

        <div class="update-tag">
            NEWS
        </div>

        <div class="card-title">
            尾羽急 最新情報
        </div>

        <p>
            尾羽急電鉄に関する最新情報をチェック！
        </p>

        <button
            class="secondary"
            style="margin-top:13px"
            onclick="showPage('updates')">
            詳しく見る
        </button>

    </div>


    <div class="card glass">

        <div class="card-title">
            最新の投稿
        </div>

        <div id="homePosts">
            <div class="loading">
                読み込み中…
            </div>
        </div>

    </div>

</section>


<!-- UPDATES -->

<section id="updatesPage" class="page">

    <div class="card glass">

        <div class="card-title">
            🚃 尾羽急 最新情報
        </div>

        <p style="line-height:1.8">
            ここに尾羽急電鉄の最新情報を掲載できます。
            <br><br>
            新型車両、ダイヤ改正、駅の追加、
            路線情報などを投稿できます。
        </p>

    </div>

</section>


<!-- POSTS -->

<section id="postsPage" class="page">

    <div class="card glass">

        <div class="card-title">
            📝 みんなの投稿
        </div>

        <button
            class="primary"
            onclick="openPostModal()">
            ＋ 新しく投稿
        </button>

    </div>

    <div id="allPosts">
        <div class="loading">
            読み込み中…
        </div>
    </div>

</section>


<!-- PROFILE -->

<section id="profilePage" class="page">

    <div id="profileArea">
        <div class="card glass empty">
            ログインするとプロフィールを表示できます。
        </div>
    </div>

</section>

</main>


<!-- NAV -->

<nav class="bottom-nav glass">

    <button
        class="nav-btn active"
        onclick="showPage('home')">
        🏠 ホーム
    </button>

    <button
        class="nav-btn"
        onclick="showPage('posts')">
        📝 投稿
    </button>

    <button
        class="nav-btn"
        onclick="showPage('updates')">
        🚃 情報
    </button>

    <button
        class="nav-btn"
        onclick="showPage('profile')">
        👤 プロフィール
    </button>

</nav>


<!-- LOGIN -->

<div id="loginModal" class="modal-bg">

    <div class="modal glass">

        <h2>ログイン</h2>

        <input
            id="loginEmail"
            class="input"
            type="email"
            placeholder="メールアドレス">

        <input
            id="loginPassword"
            class="input"
            type="password"
            placeholder="パスワード">

        <div class="modal-buttons">

            <button
                class="primary"
                onclick="login()">
                ログイン
            </button>

            <button
                class="close-btn"
                onclick="closeModal('loginModal')">
                閉じる
            </button>

        </div>

        <div class="switch">
            アカウントを持っていない？
            <button onclick="switchToRegister()">
                新規登録
            </button>
        </div>

    </div>

</div>


<!-- REGISTER -->

<div id="registerModal" class="modal-bg">

    <div class="modal glass">

        <h2>アカウント作成</h2>

        <input
            id="registerUsername"
            class="input"
            type="text"
            maxlength="20"
            placeholder="ユーザー名">

        <input
            id="registerEmail"
            class="input"
            type="email"
            placeholder="メールアドレス">

        <input
            id="registerPassword"
            class="input"
            type="password"
            placeholder="パスワード">

        <div class="modal-buttons">

            <button
                class="primary"
                onclick="register()">
                登録
            </button>

            <button
                class="close-btn"
                onclick="closeModal('registerModal')">
                閉じる
            </button>

        </div>

        <div class="switch">
            すでにアカウントがある？
            <button onclick="switchToLogin()">
                ログイン
            </button>
        </div>

    </div>

</div>


<!-- POST -->

<div id="postModal" class="modal-bg">

    <div class="modal glass">

        <h2>新しい投稿</h2>

        <textarea
            id="postContent"
            class="input"
            maxlength="1000"
            placeholder="鉄道について投稿しよう！"></textarea>

        <div class="modal-buttons">

            <button
                class="primary"
                onclick="createPost()">
                投稿する
            </button>

            <button
                class="close-btn"
                onclick="closeModal('postModal')">
                閉じる
            </button>

        </div>

    </div>

</div>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://ffuochpjwdxlrtzykewk.supabase.co";

const SUPABASE_ANON_KEY =
"sb_publishable_-nKEIwdoeKC_-GD0UxbGXw_NbB0fGD5";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


/* =========================
   初期化
========================= */

let currentUser = null;


async function init(){

    const {
        data,
        error
    } = await supabaseClient.auth.getUser();

    if(!error && data.user){
        currentUser = data.user;
    }

    updateHeader();
    updateProfile();
    loadPosts();
}


/* =========================
   HEADER
========================= */

async function updateHeader(){

    const nameElement =
        document.getElementById("headerUser");

    const button =
        document.getElementById("headerButton");

    if(!currentUser){

        nameElement.textContent =
            "未ログイン";

        button.textContent =
            "ログイン";

        button.onclick =
            openLogin;

        return;
    }

    let username =
        currentUser.user_metadata?.username;

    if(!username){

        const {
            data
        } =
        await supabaseClient
        .from("profiles")
        .select("username")
        .eq("id",currentUser.id)
        .maybeSingle();

        username =
            data?.username ||
            currentUser.email?.split("@")[0] ||
            "ユーザー";
    }

    nameElement.textContent =
        username;

    button.textContent =
        "ログアウト";

    button.onclick =
        logout;
}


/* =========================
   登録
========================= */

async function register(){

    const username =
        document
        .getElementById("registerUsername")
        .value
        .trim();

    const email =
        document
        .getElementById("registerEmail")
        .value
        .trim();

    const password =
        document
        .getElementById("registerPassword")
        .value;

    if(!username){
        alert("ユーザー名を入力して！");
        return;
    }

    if(username.length < 2){
        alert("ユーザー名は2文字以上にしてね！");
        return;
    }

    if(!email){
        alert("メールアドレスを入力して！");
        return;
    }

    if(password.length < 6){
        alert("パスワードは6文字以上にしてね！");
        return;
    }


    const {
        data,
        error
    } =
    await supabaseClient.auth.signUp({

        email:email,

        password:password,

        options:{
            data:{
                username:username
            }
        }

    });


    if(error){

        alert(
            "登録できませんでした。\n" +
            error.message
        );

        return;
    }


    if(data.user){

        const {
            error:profileError
        } =
        await supabaseClient
        .from("profiles")
        .upsert({

            id:data.user.id,

            username:username

        });


        if(profileError){

            console.error(profileError);

        }
    }


    closeModal("registerModal");


    alert(
        "登録しました！\n\n" +
        "メール確認が必要な設定の場合は、" +
        "届いたメールを確認してね。"
    );


    if(data.session){

        currentUser =
            data.user;

        updateHeader();
        updateProfile();

    }else{

        openLogin();
    }

}


/* =========================
   LOGIN
========================= */

async function login(){

    const email =
        document
        .getElementById("loginEmail")
        .value
        .trim();

    const password =
        document
        .getElementById("loginPassword")
        .value;


    if(!email || !password){

        alert(
            "メールアドレスとパスワードを入力して！"
        );

        return;
    }


    const {
        data,
        error
    } =
    await supabaseClient.auth
    .signInWithPassword({

        email:email,

        password:password

    });


    if(error){

        alert(
            "ログインできませんでした。\n" +
            error.message
        );

        return;
    }


    currentUser =
        data.user;

    closeModal("loginModal");

    updateHeader();
    updateProfile();

    alert("ログインしました！");

}


/* =========================
   LOGOUT
========================= */

async function logout(){

    await supabaseClient.auth.signOut();

    currentUser = null;

    updateHeader();
    updateProfile();

    alert("ログアウトしました！");
}


/* =========================
   PROFILE
========================= */

async function updateProfile(){

    const area =
        document.getElementById("profileArea");

    if(!currentUser){

        area.innerHTML = `
            <div class="card glass empty">
                ログインするとプロフィールを表示できます。
            </div>
        `;

        return;
    }


    let username =
        currentUser.user_metadata?.username;


    if(!username){

        const {
            data
        } =
        await supabaseClient
        .from("profiles")
        .select("username")
        .eq("id",currentUser.id)
        .maybeSingle();

        username =
            data?.username ||
            currentUser.email?.split("@")[0] ||
            "ユーザー";
    }


    area.innerHTML = `

        <div class="card glass profile">

            <div class="avatar">
                ${escapeHTML(
                    username
                    .charAt(0)
                    .toUpperCase()
                )}
            </div>

            <div class="profile-name">
                ${escapeHTML(username)}
            </div>

            <div class="profile-info">
                ${escapeHTML(
                    currentUser.email || ""
                )}
            </div>

            <button
                class="secondary"
                style="margin-top:20px"
                onclick="logout()">
                ログアウト
            </button>

        </div>

    `;
}


/* =========================
   POSTS 読み込み
========================= */

async function loadPosts(){

    const {
        data,
        error
    } =
    await supabaseClient
    .from("posts")
    .select("*")
    .order("created_at",{
        ascending:false
    });


    if(error){

        console.error(error);

        document.getElementById(
            "homePosts"
        ).innerHTML = `
            <div class="empty">
                投稿を読み込めませんでした。
            </div>
        `;

        document.getElementById(
            "allPosts"
        ).innerHTML = `
            <div class="empty">
                投稿を読み込めませんでした。
            </div>
        `;

        return;
    }


    renderPosts(data || []);
}


/* =========================
   POST表示
========================= */

function renderPosts(posts){

    if(!posts.length){

        document.getElementById(
            "homePosts"
        ).innerHTML = `
            <div class="empty">
                まだ投稿がありません。
            </div>
        `;

        document.getElementById(
            "allPosts"
        ).innerHTML = `
            <div class="card glass empty">
                まだ投稿がありません。
            </div>
        `;

        return;
    }


    const html =
        posts.map(post => {

            const date =
                formatDate(post.created_at);

            const username =
                post.username ||
                "ユーザー";

            return `

                <div class="post glass">

                    <div class="post-head">

                        <div class="post-user">
                            👤
                            ${escapeHTML(username)}
                        </div>

                        <div class="post-date">
                            ${date}
                        </div>

                    </div>

                    <div class="post-content">
                        ${escapeHTML(
                            post.content || ""
                        )}
                    </div>

                    <div class="post-actions">

                        <button
                            class="action-btn"
                            onclick="likePost('${post.id}')">

                            ❤️
                            ${post.likes || 0}

                        </button>

                    </div>

                </div>

            `;

        }).join("");


    document.getElementById(
        "homePosts"
    ).innerHTML =
        posts
        .slice(0,5)
        .map(post => {

            const date =
                formatDate(post.created_at);

            return `

                <div class="post glass">

                    <div class="post-head">

                        <div class="post-user">
                            👤
                            ${escapeHTML(
                                post.username ||
                                "ユーザー"
                            )}
                        </div>

                        <div class="post-date">
                            ${date}
                        </div>

                    </div>

                    <div class="post-content">
                        ${escapeHTML(
                            post.content || ""
                        )}
                    </div>

                    <div class="post-actions">

                        <button
                            class="action-btn"
                            onclick="likePost('${post.id}')">

                            ❤️
                            ${post.likes || 0}

                        </button>

                    </div>

                </div>

            `;

        }).join("");


    document.getElementById(
        "allPosts"
    ).innerHTML =
        html;
}


/* =========================
   投稿作成
========================= */

async function createPost(){

    if(!currentUser){

        closeModal("postModal");

        openLogin();

        return;
    }


    const textarea =
        document.getElementById(
            "postContent"
        );

    const content =
        textarea.value.trim();


    if(!content){

        alert("投稿内容を入力して！");
        return;
    }


    let username =
        currentUser.user_metadata?.username;


    if(!username){

        const {
            data
        } =
        await supabaseClient
        .from("profiles")
        .select("username")
        .eq("id",currentUser.id)
        .maybeSingle();

        username =
            data?.username ||
            currentUser.email?.split("@")[0] ||
            "ユーザー";
    }


    const {
        error
    } =
    await supabaseClient
    .from("posts")
    .insert({

        user_id:
            currentUser.id,

        username:
            username,

        content:
            content,

        likes:
            0

    });


    if(error){

        console.error(error);

        alert(
            "投稿できませんでした。\n" +
            error.message
        );

        return;
    }


    textarea.value = "";

    closeModal("postModal");

    await loadPosts();

    alert("投稿しました！");
}


/* =========================
   LIKE
========================= */

async function likePost(id){

    if(!currentUser){

        openLogin();

        return;
    }


    const {
        data,
        error
    } =
    await supabaseClient
    .from("posts")
    .select("likes")
    .eq("id",id)
    .single();


    if(error){

        console.error(error);
        return;
    }


    const likes =
        Number(data.likes || 0) + 1;


    const {
        error:updateError
    } =
    await supabaseClient
    .from("posts")
    .update({
        likes:likes
    })
    .eq("id",id);


    if(updateError){

        console.error(updateError);

        alert(
            "いいねできませんでした。\n" +
            updateError.message
        );

        return;
    }


    await loadPosts();
}


/* =========================
   PAGE
========================= */

function showPage(page){

    document
    .querySelectorAll(".page")
    .forEach(p =>
        p.classList.remove("active")
    );


    const target =
        document.getElementById(
            page + "Page"
        );


    if(target){

        target.classList.add("active");

    }


    document
    .querySelectorAll(".nav-btn")
    .forEach(btn =>
        btn.classList.remove("active")
    );


    const buttons =
        document.querySelectorAll(
            ".nav-btn"
        );


    const index = {
        home:0,
        posts:1,
        updates:2,
        profile:3
    }[page];


    if(buttons[index]){
        buttons[index]
        .classList.add("active");
    }


    if(page === "posts"){
        loadPosts();
    }

    if(page === "profile"){
        updateProfile();
    }
}


/* =========================
   MODAL
========================= */

function openLogin(){

    closeModal("registerModal");

    document
    .getElementById("loginModal")
    .classList.add("show");
}


function openRegister(){

    closeModal("loginModal");

    document
    .getElementById("registerModal")
    .classList.add("show");
}


function openPostModal(){

    if(!currentUser){

        openLogin();

        return;
    }

    document
    .getElementById("postModal")
    .classList.add("show");
}


function closeModal(id){

    document
    .getElementById(id)
    .classList.remove("show");
}


function switchToRegister(){

    closeModal("loginModal");

    openRegister();
}


function switchToLogin(){

    closeModal("registerModal");

    openLogin();
}


/* =========================
   DATE
========================= */

function formatDate(date){

    if(!date){
        return "";
    }


    const d =
        new Date(date);


    return d.toLocaleString(
        "ja-JP",
        {
            year:"numeric",
            month:"numeric",
            day:"numeric",
            hour:"2-digit",
            minute:"2-digit"
        }
    );
}


/* =========================
   XSS対策
========================= */

function escapeHTML(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* =========================
   AUTH状態監視
========================= */

supabaseClient.auth
.onAuthStateChange(
    async (event,session)=>{

        currentUser =
            session?.user || null;

        updateHeader();
        updateProfile();
        loadPosts();

    }
);


/* =========================
   START
========================= */

init();
