<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>尾羽急ルーレット</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;
  background:#030308;
  color:white;
}

body{
  display:flex;
  justify-content:center;
  align-items:center;
  position:relative;
}

#background{
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at 50% 45%,
      #35177c 0%,
      #110b2b 35%,
      #050509 75%,
      #000 100%);
  z-index:-10;
}

#rainbowBg{
  position:fixed;
  inset:-60%;
  background:conic-gradient(
    red,
    orange,
    yellow,
    lime,
    cyan,
    blue,
    violet,
    magenta,
    red
  );
  opacity:0;
  filter:blur(35px);
  z-index:-9;
  transition:opacity:.3s;
}

#flash{
  position:fixed;
  inset:0;
  background:white;
  opacity:0;
  pointer-events:none;
  z-index:9999;
}

.flashAnimation{
  animation:flash .35s ease;
}

@keyframes flash{
  0%{opacity:0}
  15%{opacity:1}
  100%{opacity:0}
}


/* =========================
   メイン
========================= */

.container{
  width:min(920px,94vw);
  text-align:center;
  position:relative;
}

h1{
  margin:0;
  font-size:clamp(34px,8vw,70px);
  font-weight:1000;
  letter-spacing:4px;

  text-shadow:
    0 0 5px white,
    0 0 15px #9d5cff,
    0 0 35px #7b32ff,
    0 0 70px #7b32ff;
}

.subtitle{
  margin-top:3px;
  margin-bottom:12px;
  font-size:14px;
  opacity:.7;
}

#mode{
  display:inline-block;
  padding:7px 22px;
  margin-bottom:15px;

  border-radius:999px;
  border:2px solid #555;

  background:#1b1b27;
  font-weight:1000;
}

#mode.kakuhen{
  background:
    linear-gradient(
      90deg,
      #ff0080,
      #7b2cff,
      #00d9ff,
      #7b2cff,
      #ff0080
    );
  background-size:300% 100%;

  border-color:white;

  box-shadow:
    0 0 10px white,
    0 0 30px #ff00ff,
    0 0 60px #00ffff;

  animation:kakuhenMode .7s linear infinite;
}

@keyframes kakuhenMode{
  0%{background-position:0%}
  100%{background-position:300%}
}


/* =========================
   スロット
========================= */

.slot{
  position:relative;
  height:300px;

  padding:8px;

  border-radius:35px;

  background:
    linear-gradient(#14141f,#050509) padding-box,
    linear-gradient(
      135deg,
      white,
      #8c4cff,
      #00eaff,
      white,
      #ff00cc
    ) border-box;

  border:5px solid transparent;

  box-shadow:
    0 0 15px #8b5cf6,
    0 0 40px #5b2cff,
    0 0 80px #00aaff,
    inset 0 0 45px black;

  overflow:hidden;
}

.slot::before,
.slot::after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  height:85px;

  z-index:5;
  pointer-events:none;
}

.slot::before{
  top:0;
  background:
    linear-gradient(
      to bottom,
      rgba(0,0,0,.96),
      transparent
    );
}

.slot::after{
  bottom:0;
  background:
    linear-gradient(
      to top,
      rgba(0,0,0,.96),
      transparent
    );
}


/*
  中央の表示位置

  線は使わず、
  中央の文字がここに来るようにする
*/

.reel{
  width:100%;
  height:100%;
  overflow:hidden;
  position:relative;
}

.reelTrack{
  position:absolute;
  width:100%;
  left:0;
  top:0;
}

.reelItem{
  height:95px;

  display:flex;
  justify-content:center;
  align-items:center;

  padding:0 10px;

  font-size:clamp(21px,5vw,44px);
  font-weight:1000;

  white-space:nowrap;

  text-shadow:
    0 0 5px white,
    0 0 15px currentColor,
    0 0 35px currentColor;
}


/* =========================
   結果
========================= */

#result{
  min-height:60px;
  margin-top:12px;

  font-size:clamp(20px,5vw,40px);
  font-weight:1000;

  text-shadow:
    0 0 8px white,
    0 0 20px #8b5cf6,
    0 0 40px #8b5cf6;
}

#rarity{
  min-height:28px;
  font-size:22px;
  font-weight:1000;
}


/* =========================
   ボタン
========================= */

#spinButton{
  width:min(500px,90vw);
  height:75px;

  margin-top:18px;

  border:0;
  border-radius:24px;

  color:white;

  font-size:30px;
  font-weight:1000;

  background:
    linear-gradient(
      135deg,
      #ff006e,
      #792cff,
      #00c8ff
    );

  box-shadow:
    0 0 15px #ff00aa,
    0 0 35px #743cff,
    0 0 70px #00c8ff;
}

#spinButton:active{
  transform:scale(.94);
}

#spinButton:disabled{
  opacity:.45;
}


/* =========================
   全画面演出
========================= */

.overlay{
  position:fixed;
  inset:0;

  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;

  z-index:8000;

  pointer-events:none;

  opacity:0;
}

.overlay.show{
  opacity:1;
}

.overlayText{
  font-size:clamp(55px,15vw,180px);
  line-height:.9;

  font-weight:1000;
  text-align:center;

  text-shadow:
    0 0 10px white,
    0 0 30px currentColor,
    0 0 70px currentColor,
    0 0 130px currentColor;
}

.overlaySub{
  margin-top:20px;

  font-size:clamp(20px,5vw,50px);
  font-weight:1000;

  text-shadow:
    0 0 10px white,
    0 0 30px #00eaff;
}


/* =========================
   虹文字
========================= */

.rainbow{
  background:
    linear-gradient(
      90deg,
      red,
      orange,
      yellow,
      lime,
      cyan,
      blue,
      violet,
      magenta,
      red
    );

  background-size:500% 100%;

  -webkit-background-clip:text;
  background-clip:text;

  color:transparent;

  animation:
    rainbowText .6s linear infinite;
}

@keyframes rainbowText{
  from{background-position:0%}
  to{background-position:500%}
}


/* =========================
   揺れ
========================= */

.shake{
  animation:shake .07s infinite;
}

@keyframes shake{
  0%{transform:translate(0,0)}
  25%{transform:translate(8px,-5px)}
  50%{transform:translate(-8px,6px)}
  75%{transform:translate(6px,7px)}
  100%{transform:translate(-6px,-6px)}
}


/* =========================
   パルス
========================= */

.pulse{
  animation:pulse .22s infinite alternate;
}

@keyframes pulse{
  from{transform:scale(1)}
  to{transform:scale(1.07)}
}


/* =========================
   パーティクル
========================= */

.particle{
  position:fixed;

  width:9px;
  height:9px;

  border-radius:50%;

  background:white;

  box-shadow:
    0 0 8px white,
    0 0 20px #00eaff,
    0 0 35px #ff00ff;

  pointer-events:none;

  z-index:8500;
}


/* =========================
   レア度
========================= */

.n{
  color:#ddd;
}

.r{
  color:#5cff7a;
}

.sr{
  color:#00d9ff;
}

.ssr{
  color:#ffd000;
}

.ur{
  color:#ff4cff;
}

.lr{
  color:white;
}


/* =========================
   スマホ
========================= */

@media(max-width:600px){

  .slot{
    height:270px;
  }

  .reelItem{
    height:85px;
  }

}
</style>
</head>

<body>

<div id="background"></div>
<div id="rainbowBg"></div>
<div id="flash"></div>


<div class="container">

  <h1>尾羽急ルーレット</h1>

  <div class="subtitle">
    超超超激アツ・昇格・確変搭載
  </div>

  <div id="mode">
    通常時
  </div>


  <div class="slot" id="slot">

    <div class="reel">

      <div
        class="reelTrack"
        id="reelTrack">
      </div>

    </div>

  </div>


  <div id="result">
    START
  </div>

  <div id="rarity"></div>


  <button
    id="spinButton"
    onclick="spin()">
    🎰 回す！
  </button>

</div>


<!-- 全画面演出 -->

<div
  class="overlay"
  id="overlay">

  <div
    class="overlayText"
    id="overlayText">
  </div>

  <div
    class="overlaySub"
    id="overlaySub">
  </div>

</div>


<script>

/* =====================================================
   尾羽急列車データ
===================================================== */

const trains=[

"尾羽原発普通安越行き",
"尾羽原発普通雲谷行き",
"尾羽原発普通高徳行き",
"尾羽原発普通紀田行き",
"尾羽原発普通千鳥行き",
"尾羽原発普通金田行き",
"尾羽原発普通金田新都心行き",
"尾羽原発普通百鳥行き",
"尾羽原発普通北尾羽行き",
"尾羽原発普通奥千鳥行き",
"尾羽原発普通飛岡行き",
"尾羽原発普通飛水竜田行き",
"尾羽原発普通飛水柏原行き",

"尾羽原発快速高徳行き",
"尾羽原発快速紀田行き",
"尾羽原発快速千鳥行き",
"尾羽原発快速奥千鳥行き",

"尾羽原発急行紀田行き",
"尾羽原発急行千鳥行き",
"尾羽原発急行金田行き",
"尾羽原発急行金田新都心行き",

"尾羽原発準急高徳行き",
"尾羽原発準急紀田行き",
"尾羽原発準急金田行き",

"尾羽原発快速急行千鳥行き",
"尾羽原発快速急行金田行き",
"尾羽原発快速急行北尾羽行き",
"尾羽原発快速急行金田新都心行き",

"尾羽原発エアポート急行高徳空港行き",

"尾羽原発特急やまかぜ北尾羽行き",
"尾羽原発air特急金田新都心行き",
"尾羽原発特急つばき金田新都心行き",
"尾羽原発特急スーパーつばき金田新都心行き(全停車型)",
"尾羽原発特急スーパーつばき金田新都心行き(速達)",
"尾羽原発特急ほしみ金田新都心行き",

"井口発普通列車本郷行き",
"井口発普通列車千鳥行き(井問)",
"井口発普通列車千鳥行き(千鳥支)",

"北尾羽発普通百鳥行き",
"北尾羽発普通金田行き",
"北尾羽発普通金田新都心行き",
"北尾羽発特急はね金田新都心行き",

"千鳥発普通金田行き",
"千鳥発普通金田新都心行き",
"千鳥発普通北尾羽行き",
"千鳥発普通高徳行き",
"千鳥発普通尾羽原行き",

"千鳥発準急金田行き",
"千鳥発準急北尾羽行き",
"千鳥発準急高徳行き",
"千鳥発準急尾羽原行き",

"千鳥発急行高徳行き",
"千鳥発急行尾羽原行き",
"千鳥発急行金田行き",
"千鳥発急行金田新都心行き",
"千鳥発急行百鳥行き",
"千鳥発急行北尾羽行き",

"千鳥発快速急行金田行き",
"千鳥発快速急行金田新都心行き",
"千鳥発快速急行北尾羽行き",
"千鳥発快速急行高徳行き",
"千鳥発快速急行尾羽原行き",

"千鳥発普通本郷行き(井問)",
"千鳥発普通本郷行き(千鳥支)",
"千鳥発普通井口行き(井問)",
"千鳥発普通井口行き(千鳥支)"

];


/* =====================================================
   状態
===================================================== */

let spinning=false;
let kakuhen=false;


/* =====================================================
   種別
===================================================== */

function getType(train){

  if(
    train.includes("特急") ||
    train.includes("air特急")
  ){
    return "特急";
  }

  if(train.includes("快速急行")){
    return "快速急行";
  }

  if(train.includes("エアポート急行")){
    return "エアポート急行";
  }

  if(train.includes("急行")){
    return "急行";
  }

  if(train.includes("快速")){
    return "快速";
  }

  if(train.includes("準急")){
    return "準急";
  }

  return "普通";
}


/* =====================================================
   レア度
===================================================== */

function getRarity(type){

  switch(type){

    case "普通":
      return ["N","n"];

    case "準急":
      return ["R","r"];

    case "快速":
      return ["SR","sr"];

    case "急行":
      return ["SSR","ssr"];

    case "エアポート急行":
      return ["UR","ur"];

    case "快速急行":
      return ["UR","ur"];

    case "特急":
      return ["LR","lr"];

    default:
      return ["N","n"];
  }
}


/* =====================================================
   ランク
===================================================== */

const rank={

  "普通":1,
  "準急":2,
  "快速":3,
  "急行":4,
  "エアポート急行":5,
  "快速急行":6,
  "特急":7

};


/* =====================================================
   重み付き抽選
===================================================== */

function chooseTrain(){

  let weights=[];

  for(const train of trains){

    const type=getType(train);

    let weight=1;

    if(kakuhen){

      switch(type){

        case "普通":
          weight=1;
          break;

        case "準急":
          weight=2;
          break;

        case "快速":
          weight=4;
          break;

        case "急行":
          weight=7;
          break;

        case "エアポート急行":
          weight=9;
          break;

        case "快速急行":
          weight=12;
          break;

        case "特急":
          weight=15;
          break;

      }
    }

    weights.push(weight);
  }


  const total=
    weights.reduce(
      (a,b)=>a+b,
      0
    );

  let r=
    Math.random()*total;


  for(let i=0;i<trains.length;i++){

    r-=weights[i];

    if(r<=0){
      return trains[i];
    }

  }

  return trains[0];
}


/* =====================================================
   昇格確率
===================================================== */

function upgradeChance(type){

  if(kakuhen){

    switch(type){

      case "普通":
        return .20;

      case "準急":
        return .28;

      case "快速":
        return .40;

      case "急行":
        return .55;

      case "エアポート急行":
        return .65;

      case "快速急行":
        return .78;

      case "特急":
        return .90;

    }

  }else{

    switch(type){

      case "普通":
        return .08;

      case "準急":
        return .12;

      case "快速":
        return .20;

      case "急行":
        return .30;

      case "エアポート急行":
        return .42;

      case "快速急行":
        return .58;

      case "特急":
        return .80;

    }

  }

  return 0;
}


/* =====================================================
   昇格先
===================================================== */

function getUpgradeType(type){

  const current=rank[type];

  const possible=
    Object.keys(rank)
      .filter(
        x=>rank[x]>current
      );


  if(possible.length===0){
    return type;
  }


  let weights=[];

  for(const target of possible){

    const difference=
      rank[target]-current;

    weights.push(
      Math.max(
        1,
        8-difference*2
      )
    );

  }


  const total=
    weights.reduce(
      (a,b)=>a+b,
      0
    );

  let r=Math.random()*total;


  for(let i=0;i<possible.length;i++){

    r-=weights[i];

    if(r<=0){
      return possible[i];
    }

  }

  return possible[0];
}


/* =====================================================
   指定種別の列車
===================================================== */

function randomTrainOfType(type){

  const list=
    trains.filter(
      train=>getType(train)===type
    );

  if(list.length===0){
    return null;
  }

  return list[
    Math.floor(
      Math.random()*list.length
    )
  ];
}


/* =====================================================
   リール
===================================================== */

function createReelItems(finalTrain){

  const track=
    document.getElementById(
      "reelTrack"
    );

  track.innerHTML="";


  const items=[];

  for(let i=0;i<50;i++){

    items.push(
      trains[
        Math.floor(
          Math.random()*trains.length
        )
      ]
    );

  }


  /*
    最後に本命
  */

  items.push(finalTrain);


  items.forEach(train=>{

    const div=
      document.createElement(
        "div"
      );

    div.className="reelItem";


    const type=
      getType(train);

    const rarity=
      getRarity(type);


    div.classList.add(
      rarity[1]
    );

    div.textContent=type;

    track.appendChild(div);

  });
}


/* =====================================================
   待機
===================================================== */

function wait(ms){

  return new Promise(
    resolve=>setTimeout(
      resolve,
      ms
    )
  );

}


/* =====================================================
   フラッシュ
===================================================== */

function flash(times=1){

  const f=
    document.getElementById(
      "flash"
    );


  for(let i=0;i<times;i++){

    setTimeout(()=>{

      f.classList.remove(
        "flashAnimation"
      );

      void f.offsetWidth;

      f.classList.add(
        "flashAnimation"
      );

    },i*130);

  }
}


/* =====================================================
   パーティクル
===================================================== */

function particles(count=80){

  for(let i=0;i<count;i++){

    const p=
      document.createElement(
        "div"
      );

    p.className="particle";

    p.style.left=
      Math.random()*100+"vw";

    p.style.top=
      Math.random()*100+"vh";


    document.body.appendChild(p);


    const x=
      (Math.random()-.5)*800;

    const y=
      (Math.random()-.5)*800;


    p.animate(

      [
        {
          transform:
            "translate(0,0) scale(1)",
          opacity:1
        },

        {
          transform:
            `translate(${x}px,${y}px) scale(0)`,
          opacity:0
        }
      ],

      {
        duration:
          800+Math.random()*1200,

        easing:
          "cubic-bezier(.1,.8,.2,1)"
      }

    );


    setTimeout(
      ()=>p.remove(),
      2200
    );

  }
}


/* =====================================================
   オーバーレイ
===================================================== */

function showOverlay(
  text,
  sub="",
  className=""
){

  const overlay=
    document.getElementById(
      "overlay"
    );

  const textElement=
    document.getElementById(
      "overlayText"
    );

  const subElement=
    document.getElementById(
      "overlaySub"
    );


  textElement.className=
    "overlayText "+className;

  textElement.textContent=text;

  subElement.textContent=sub;

  overlay.classList.add(
    "show"
  );

}


function hideOverlay(){

  document
    .getElementById(
      "overlay"
    )
    .classList.remove(
      "show"
    );

}


/* =====================================================
   虹
===================================================== */

function rainbowMode(enabled){

  document
    .getElementById(
      "rainbowBg"
    )
    .style.opacity=
      enabled?".5":"0";

}


/* =====================================================
   昇格
===================================================== */

async function upgradeEffect(
  from,
  to
){

  showOverlay(
    "CHANCE!",
    "まだ終わらない……"
  );

  flash(2);
  particles(50);

  document.body.classList.add(
    "shake"
  );


  await wait(1000);


  document.body.classList.remove(
    "shake"
  );


  showOverlay(
    "昇格!!",
    from+" → "+to,
    "rainbow"
  );

  rainbowMode(true);

  flash(7);
  particles(150);


  await wait(1500);


  hideOverlay();

  rainbowMode(false);
}


/* =====================================================
   レア演出
===================================================== */

async function rareEffect(type){

  if(type==="急行"){

    showOverlay(
      "激アツ!!",
      "急行出現!!",
      "rainbow"
    );

    flash(5);
    particles(100);

    document.body.classList.add(
      "shake"
    );

    await wait(1600);
  }


  else if(type==="エアポート急行"){

    showOverlay(
      "超激アツ!!",
      "エアポート急行!!",
      "rainbow"
    );

    flash(8);
    particles(160);

    document.body.classList.add(
      "shake"
    );

    await wait(1900);
  }


  else if(type==="快速急行"){

    showOverlay(
      "UR!!",
      "快速急行!!",
      "rainbow"
    );

    flash(10);
    particles(210);

    document.body.classList.add(
      "shake"
    );

    await wait(2200);
  }


  else if(type==="特急"){

    showOverlay(
      "特急確定!!",
      "SUPER RARE",
      "rainbow"
    );

    rainbowMode(true);

    flash(15);
    particles(300);

    document.body.classList.add(
      "shake"
    );

    await wait(2600);
  }


  document.body.classList.remove(
    "shake"
  );

  rainbowMode(false);

  hideOverlay();
}


/* =====================================================
   確変
===================================================== */

async function enterKakuhen(){

  showOverlay(
    "確変突入!!",
    "HIGH SPEED MODE",
    "rainbow"
  );

  rainbowMode(true);

  document.body.classList.add(
    "shake"
  );

  flash(12);
  particles(280);


  await wait(2600);


  document.body.classList.remove(
    "shake"
  );


  kakuhen=true;


  const mode=
    document.getElementById(
      "mode"
    );

  mode.textContent=
    "🔥 確変中 🔥";

  mode.classList.add(
    "kakuhen"
  );


  hideOverlay();
}


/* =====================================================
   両数
===================================================== */

/*
  対象列車だけ
  2両 / 3両以上を
  完全ランダムで決定
*/

function needsCarChoice(train){

  /*
    井口発 → 対象外
  */

  if(train.startsWith("井口発")){
    return false;
  }


  /*
    千鳥発
    本郷・井口
    井問・千鳥支 → 対象外
  */

  if(
    train.includes(
      "千鳥発普通本郷行き(井問)"
    ) ||

    train.includes(
      "千鳥発普通本郷行き(千鳥支)"
    ) ||

    train.includes(
      "千鳥発普通井口行き(井問)"
    ) ||

    train.includes(
      "千鳥発普通井口行き(千鳥支)"
    )
  ){
    return false;
  }


  /*
    飛水竜田・飛水柏原
    → 対象外
  */

  if(
    train==="尾羽原発普通飛水竜田行き" ||

    train==="尾羽原発普通飛水柏原行き"
  ){
    return false;
  }


  return true;
}


/*
  両数をランダム決定
*/

function randomCars(){

  return Math.random()<.5
    ? "2両"
    : "3両以上";

}


/* =====================================================
   両数演出
===================================================== */

async function carEffect(
  train
){

  const cars=
    randomCars();


  showOverlay(
    "編成決定!!",
    "……"+cars+"……",
    cars==="3両以上"
      ?"rainbow"
      :""
  );


  if(cars==="3両以上"){

    rainbowMode(true);

    flash(7);

    particles(150);

  }else{

    flash(3);

    particles(50);

  }


  await wait(1500);


  hideOverlay();

  rainbowMode(false);


  document.getElementById(
    "result"
  ).textContent=
    train+"【"+cars+"】";


  return cars;
}


/* =====================================================
   メイン
===================================================== */

async function spin(){

  if(spinning){
    return;
  }


  spinning=true;


  const button=
    document.getElementById(
      "spinButton"
    );

  button.disabled=true;


  const result=
    document.getElementById(
      "result"
    );

  const rarity=
    document.getElementById(
      "rarity"
    );

  const slot=
    document.getElementById(
      "slot"
    );


  result.textContent=
    "回転中……";

  rarity.textContent="";


  /*
    通常抽選
  */

  let finalTrain=
    chooseTrain();

  let originalType=
    getType(finalTrain);

  let finalType=
    originalType;


  /*
    昇格抽選
  */

  if(
    Math.random()<
    upgradeChance(
      originalType
    )
  ){

    const upgrade=
      getUpgradeType(
        originalType
      );


    if(
      upgrade!==originalType
    ){

      finalType=upgrade;


      const upgradedTrain=
        randomTrainOfType(
          finalType
        );


      if(upgradedTrain){
        finalTrain=
          upgradedTrain;
      }

    }

  }


  /*
    リール
  */

  createReelItems(
    finalTrain
  );


  const track=
    document.getElementById(
      "reelTrack"
    );


  const itemHeight=95;


  /*
    ★ここが中央停止の重要部分★

    スロット高さ300px

    中央 = 150px

    1項目 = 95px

    項目の中央 = 47.5px

    よって
    150 - 47.5 = 102.5px

    本命項目が中央に来るように
    位置を計算する
  */

  const slotHeight=
    document
      .querySelector(".slot")
      .clientHeight;

  const targetCenter=
    slotHeight/2;

  const itemCenter=
    itemHeight/2;


  /*
    本命は50番目
  */

  const targetIndex=50;


  const distance=
    targetIndex*itemHeight
    -
    (targetCenter-itemCenter);


  /*
    初期位置
  */

  track.style.transition="none";

  track.style.transform=
    "translateY(0)";


  await wait(100);


  /*
    なめらか回転

    ゆっくり
       ↓
    加速
       ↓
    高速
       ↓
    なめらか減速
       ↓
    ★中央停止★
  */

  track.offsetHeight;


  track.style.transition=
    "transform 7.5s cubic-bezier(.08,.72,.10,1)";


  track.style.transform=
    `translateY(-${distance}px)`;


  /*
    回転中
  */

  setTimeout(
    ()=>flash(1),
    2300
  );


  setTimeout(
    ()=>slot.classList.add("pulse"),
    4500
  );


  setTimeout(
    ()=>slot.classList.remove("pulse"),
    6800
  );


  await wait(7600);


  slot.classList.remove(
    "pulse"
  );


  /*
    最終結果
  */

  const type=
    getType(finalTrain);

  const rarityData=
    getRarity(type);


  result.textContent=
    finalTrain;

  rarity.textContent=
    rarityData[0]
    +"　"
    +type;


  /*
    昇格
  */

  if(
    finalType!==originalType
  ){

    await upgradeEffect(
      originalType,
      finalType
    );

  }


  /*
    急行以上
  */

  if(rank[type]>=4){

    await rareEffect(type);

  }


  /*
    確変判定
  */

  if(
    !kakuhen &&
    rank[type]>=4
  ){

    let chance=0;


    switch(type){

      case "急行":
        chance=.30;
        break;

      case "エアポート急行":
        chance=.45;
        break;

      case "快速急行":
        chance=.65;
        break;

      case "特急":
        chance=.85;
        break;

    }


    if(
      Math.random()<chance
    ){

      await enterKakuhen();

    }

  }


  /*
    確変中の継続判定
  */

  else if(kakuhen){

    /*
      78%継続
      22%終了
    */

    if(
      Math.random()<.22
    ){

      showOverlay(
        "確変終了",
        "通常時へ……"
      );


      await wait(1500);


      kakuhen=false;


      const mode=
        document.getElementById(
          "mode"
        );


      mode.textContent=
        "通常時";


      mode.classList.remove(
        "kakuhen"
      );


      hideOverlay();

    }

  }


  /*
    両数
  */

  if(
    needsCarChoice(
      finalTrain
    )
  ){

    await carEffect(
      finalTrain
    );

  }


  /*
    両数対象外はそのまま
  */

  finishSpin();

}


/* =====================================================
   終了
===================================================== */

function finishSpin(){

  const button=
    document.getElementById(
      "spinButton"
    );

  button.disabled=false;

  spinning=false;

}


/* =====================================================
   初期
===================================================== */

document.getElementById(
  "result"
).textContent=
  "START";

</script>
