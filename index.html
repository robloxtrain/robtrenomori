<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>尾羽急ルーレット</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    width: 100%;
    min-height: 100%;
}

body {
    min-height: 100vh;
    background:
        radial-gradient(circle at 50% 40%, #252525 0%, #090909 55%, #000 100%);
    color: white;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    display: flex;
    justify-content: center;
    align-items: center;

    overflow-x: hidden;
}

/* =========================================
   メイン
========================================= */

.container {
    width: min(900px, 94%);
    text-align: center;
    padding: 25px 0;
}

.logo {
    font-size: clamp(32px, 8vw, 65px);
    font-weight: 900;
    letter-spacing: .08em;

    margin-bottom: 8px;

    text-shadow:
        0 0 10px rgba(255,255,255,.5),
        0 0 30px rgba(0,150,255,.5);
}

.subtitle {
    color: #888;
    font-size: 15px;
    margin-bottom: 28px;
}

/* =========================================
   ルーレット
========================================= */

.roulette-box {
    position: relative;

    width: 100%;
    min-height: 270px;

    border-radius: 28px;

    background:
        linear-gradient(
            145deg,
            #111,
            #1c1c1c 50%,
            #101010
        );

    border: 2px solid #3d3d3d;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 35px 25px;

    overflow: hidden;

    box-shadow:
        0 0 35px rgba(0,0,0,.9),
        inset 0 0 40px rgba(255,255,255,.025);

    transform: translateZ(0);
}

/* 光 */

.roulette-box::before {
    content: "";

    position: absolute;

    width: 650px;
    height: 650px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(0,150,255,.15),
            transparent 65%
        );

    animation: rotateGlow 10s linear infinite;

    pointer-events: none;
}

@keyframes rotateGlow {
    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }
}

/* 中央結果 */

.result {
    position: relative;
    z-index: 2;

    width: 100%;

    min-height: 145px;

    display: flex;
    flex-direction: column;

    justify-content: center;
    align-items: center;

    font-weight: 900;

    line-height: 1.45;

    transform: translateZ(0);

    will-change: transform, opacity;
}

.result .train {
    font-size: clamp(18px, 4vw, 30px);
    color: #aaa;

    margin-bottom: 7px;
}

.result .route {
    font-size: clamp(23px, 5.5vw, 47px);

    word-break: break-word;

    text-shadow:
        0 0 12px rgba(255,255,255,.15);
}

/* =========================================
   抽選中
========================================= */

.spinning-result {
    animation: resultPulse .15s ease-in-out infinite alternate;
}

@keyframes resultPulse {
    from {
        transform: scale(.98);
        opacity: .75;
    }

    to {
        transform: scale(1.02);
        opacity: 1;
    }
}

/* =========================================
   レア度
========================================= */

.rarity {
    margin-top: 20px;

    min-height: 38px;

    font-size: clamp(18px, 4vw, 27px);

    font-weight: 900;
}

.normal {
    color: #ddd;
}

.rare {
    color: #62aaff;

    text-shadow:
        0 0 10px rgba(50,130,255,.7);
}

.ssr {
    color: #d183ff;

    text-shadow:
        0 0 10px #9b35ff,
        0 0 25px #9b35ff;
}

.ur {
    color: #ffb33c;

    text-shadow:
        0 0 10px #ff8c00,
        0 0 25px #ff4500,
        0 0 45px #ff4500;
}

.lr {
    color: #ff6666;

    text-shadow:
        0 0 10px red,
        0 0 25px red,
        0 0 50px orange;
}

/* =========================================
   ボタン
========================================= */

button {
    margin-top: 28px;

    border: none;
    outline: none;

    padding: 18px 60px;

    border-radius: 999px;

    font-size: 24px;
    font-weight: 900;

    color: white;

    background:
        linear-gradient(
            135deg,
            #0077ff,
            #00baff
        );

    box-shadow:
        0 7px 25px rgba(0,140,255,.35);

    cursor: pointer;

    transform: translateZ(0);

    transition:
        transform .12s ease,
        box-shadow .2s ease,
        opacity .2s ease;
}

button:active {
    transform: scale(.94);
}

button:hover {
    box-shadow:
        0 8px 35px rgba(0,160,255,.55);
}

button:disabled {
    opacity: .45;
    cursor: default;
}

/* =========================================
   通常フラッシュ
========================================= */

.flash {
    animation:
        boxFlash .18s ease-in-out 6;
}

@keyframes boxFlash {

    0%, 100% {
        filter: brightness(1);
    }

    50% {
        filter: brightness(2.2);
    }
}

/* =========================================
   揺れ
========================================= */

.shake {
    animation:
        screenShake .07s linear infinite;
}

@keyframes screenShake {

    0% {
        transform: translate(0,0);
    }

    25% {
        transform: translate(3px,-2px);
    }

    50% {
        transform: translate(-3px,2px);
    }

    75% {
        transform: translate(2px,2px);
    }

    100% {
        transform: translate(-2px,-2px);
    }
}

/* =========================================
   PREMIUM
========================================= */

.premium {
    position: fixed;

    inset: 0;

    display: none;

    justify-content: center;
    align-items: center;

    z-index: 999;

    background:
        radial-gradient(
            circle,
            rgba(255,255,255,.35),
            rgba(255,40,40,.15),
            rgba(0,0,0,.94)
        );

    pointer-events: none;
}

.premium.show {
    display: flex;

    animation:
        premiumIn .45s ease forwards;
}

.premium-text {
    font-size: clamp(45px, 14vw, 140px);

    font-weight: 1000;

    text-align: center;

    color: white;

    text-shadow:
        0 0 10px red,
        0 0 30px red,
        0 0 70px orange;

    animation:
        premiumText .35s ease-in-out infinite alternate;
}

@keyframes premiumIn {

    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }
}

@keyframes premiumText {

    from {
        transform: scale(.85);
    }

    to {
        transform: scale(1.08);
    }
}

/* =========================================
   小さい画面
========================================= */

@media (max-width: 600px) {

    .container {
        width: 92%;
    }

    .roulette-box {
        min-height: 240px;
        padding: 25px 15px;
    }

    button {
        width: 85%;
        max-width: 350px;
    }

}

/* =========================================
   注意
========================================= */

.info {
    margin-top: 22px;

    color: #666;

    font-size: 12px;
}
</style>
</head>


<body>

<div class="container">

    <div class="logo">
        尾羽急ルーレット
    </div>

    <div class="subtitle">
        今日の列車を決めろ！
    </div>


    <div
        class="roulette-box"
        id="rouletteBox"
    >

        <div
            class="result"
            id="result"
        >

            <div class="train">
                🎰 準備完了
            </div>

            <div class="route">
                ルーレットを回そう！
            </div>

        </div>

    </div>


    <div
        class="rarity"
        id="rarity"
    ></div>


    <button
        id="spinButton"
    >
        🎰 回す！
    </button>


    <div class="info">
        ※ゲーム用のルーレットです
    </div>

</div>


<!-- PREMIUM演出 -->

<div
    class="premium"
    id="premium"
>

    <div
        class="premium-text"
        id="premiumText"
    >
        PREMIUM
    </div>

</div>


<script>

/* =========================================
   尾羽急 列車データ
========================================= */

const trains = [

"尾羽原発普通安越行き",
"尾羽原発普通雲谷行き",
"尾羽原発普通高徳行き",
"尾羽原発普通紀田行き",
"尾羽原発普通千鳥行き",
"尾羽原発普通金田行き",
"尾羽原発普通金田新都心行き",
"尾羽原発普通百鳥行き",
"尾羽原発普通北尾羽行き",
"尾羽原発普通奥千鳥行き",
"尾羽原発普通飛岡行き",
"尾羽原発普通飛水竜田行き",
"尾羽原発普通飛水柏原行き",

"尾羽原発快速高徳行き",
"尾羽原発快速紀田行き",
"尾羽原発快速千鳥行き",
"尾羽原発快速奥千鳥行き",

"尾羽原発急行紀田行き",
"尾羽原発急行千鳥行き",
"尾羽原発急行金田行き",
"尾羽原発急行金田新都心行き",

"尾羽原発準急高徳行き",
"尾羽原発準急紀田行き",
"尾羽原発準急金田行き",

"尾羽原発快速急行千鳥行き",
"尾羽原発快速急行金田行き",
"尾羽原発快速急行北尾羽行き",
"尾羽原発快速急行金田新都心行き",

"尾羽原発エアポート急行高徳空港行き",

"尾羽原発特急やまかぜ北尾羽行き",

"尾羽原発air特急金田新都心行き",

"尾羽原発特急つばき金田新都心行き",

"尾羽原発特急スーパーつばき金田新都心行き(全停車型)",

"尾羽原発特急スーパーつばき金田新都心行き(速達)",

"尾羽原発特急ほしみ金田新都心行き",

"井口発普通列車本郷行き",

"井口発普通列車千鳥行き(井問)",

"井口発普通列車千鳥行き(千鳥支)",

"北尾羽発普通百鳥行き",
"北尾羽発普通金田行き",
"北尾羽発普通金田新都心行き",

"北尾羽発特急はね金田新都心行き",

"千鳥発普通金田行き",
"千鳥発普通金田新都心行き",
"千鳥発普通北尾羽行き",
"千鳥発普通高徳行き",
"千鳥発普通尾羽原行き",

"千鳥発準急金田行き",
"千鳥発準急北尾羽行き",
"千鳥発準急高徳行き",
"千鳥発準急尾羽原行き",

"千鳥発急行高徳行き",
"千鳥発急行尾羽原行き",
"千鳥発急行金田行き",
"千鳥発急行金田新都心行き",
"千鳥発急行百鳥行き",
"千鳥発急行北尾羽行き",

"千鳥発快速急行金田行き",
"千鳥発快速急行金田新都心行き",
"千鳥発快速急行北尾羽行き",
"千鳥発快速急行高徳行き",
"千鳥発快速急行尾羽原行き",

"千鳥発普通本郷行き(井問)",
"千鳥発普通本郷行き(千鳥支)",

"千鳥発普通井口行き(井問)",
"千鳥発普通井口行き(千鳥支)"

];


/* =========================================
   DOM
========================================= */

const result =
    document.getElementById("result");

const rarity =
    document.getElementById("rarity");

const button =
    document.getElementById("spinButton");

const box =
    document.getElementById("rouletteBox");

const premium =
    document.getElementById("premium");

const premiumText =
    document.getElementById("premiumText");


/* =========================================
   種別判定
========================================= */

function getType(train) {

    if (train.includes("スーパーつばき"))
        return "特急";

    if (train.includes("air特急"))
        return "特急";

    if (train.includes("特急"))
        return "特急";

    if (train.includes("快速急行"))
        return "快速急行";

    if (train.includes("エアポート急行"))
        return "急行";

    if (train.includes("急行"))
        return "急行";

    if (train.includes("快速"))
        return "快速";

    if (train.includes("準急"))
        return "準急";

    return "普通";
}


/* =========================================
   レア度
========================================= */

function getRarity(type) {

    switch(type) {

        case "特急":
            return {
                name: "🌈 LR — 超激レア",
                className: "lr"
            };

        case "快速急行":
            return {
                name: "🔥 UR — 激レア",
                className: "ur"
            };

        case "急行":
            return {
                name: "💜 SSR — レア",
                className: "ssr"
            };

        case "快速":
            return {
                name: "🔵 SR — ややレア",
                className: "rare"
            };

        case "準急":
            return {
                name: "🟢 R — レア",
                className: "rare"
            };

        default:
            return {
                name: "⚪ N — ノーマル",
                className: "normal"
            };
    }
}


/* =========================================
   結果表示
========================================= */

function showResult(train) {

    const type =
        getType(train);

    const rare =
        getRarity(type);

    result.innerHTML = `
        <div class="train">
            🚃 ${type}
        </div>

        <div class="route">
            ${train}
        </div>
    `;

    result.classList.remove(
        "spinning-result"
    );

    rarity.textContent =
        rare.name;

    rarity.className =
        "rarity " + rare.className;
}


/* =========================================
   レア演出
========================================= */

function playEffect(type) {

    box.classList.remove(
        "flash",
        "shake"
    );

    premium.classList.remove(
        "show"
    );


    /* 急行 */

    if(type === "急行") {

        box.classList.add("flash");

        setTimeout(() => {

            box.classList.remove("flash");

        }, 1200);

    }


    /* 快速急行 */

    if(type === "快速急行") {

        box.classList.add("shake");

        setTimeout(() => {

            box.classList.remove("shake");

        }, 1500);

    }


    /* 特急 */

    if(type === "特急") {

        box.classList.add("shake");

        setTimeout(() => {

            box.classList.remove("shake");

            premiumText.textContent =
                "🌈 PREMIUM 🌈";

            premium.classList.add(
                "show"
            );


            setTimeout(() => {

                premium.classList.remove(
                    "show"
                );

            }, 1800);

        }, 700);

    }

}


/* =========================================
   ルーレット本体
========================================= */

let spinning = false;


button.addEventListener(
    "click",
    () => {

        if(spinning)
            return;

        spinning = true;

        button.disabled = true;

        rarity.textContent = "";


        /*
            最終結果を先に決定
        */

        const selected =
            trains[
                Math.floor(
                    Math.random()
                    * trains.length
                )
            ];


        const type =
            getType(selected);


        /*
            回転回数
        */

        const total =
            55 +
            Math.floor(
                Math.random() * 20
            );


        let count = 0;


        /*
            ルーレット開始
        */

        function roll() {

            count++;


            const progress =
                count / total;


            /*
                速度計算

                スタート
                ↓
                加速
                ↓
                高速
                ↓
                減速
            */

            let speed;


            /* -------------------------
               始動
            ------------------------- */

            if(progress < 0.15) {

                const p =
                    progress / 0.15;

                /*
                    190ms
                    ↓
                    55ms
                */

                speed =
                    190 -
                    (p * 135);

            }


            /* -------------------------
               高速
            ------------------------- */

            else if(progress < 0.62) {

                speed = 55;

            }


            /* -------------------------
               減速
            ------------------------- */

            else {

                const p =
                    (progress - 0.62) / 0.38;

                /*
                    55ms
                    ↓
                    350ms
                */

                speed =
                    55 +
                    (p * 295);

            }


            /*
                抽選中の表示
            */

            const temp =
                trains[
                    Math.floor(
                        Math.random()
                        * trains.length
                    )
                ];


            result.innerHTML = `
                <div class="train">
                    🚃 抽選中
                </div>

                <div class="route">
                    ${temp}
                </div>
            `;


            result.classList.add(
                "spinning-result"
            );


            /*
                終了
            */

            if(count >= total) {

                finish();

                return;

            }


            setTimeout(
                roll,
                speed
            );

        }


        /*
            最終停止
        */

        function finish() {

            result.classList.remove(
                "spinning-result"
            );


            /*
                一瞬暗くする
            */

            result.style.opacity = "0.2";


            setTimeout(() => {

                result.style.opacity = "1";

                showResult(selected);


                /*
                    少し間を置いて
                    レア演出
                */

                setTimeout(() => {

                    playEffect(type);

                    spinning = false;

                    button.disabled = false;

                }, 180);

            }, 180);

        }


        /*
            始動
        */

        roll();

    }
);

</script>

</body>
</html>
